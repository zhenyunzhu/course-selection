# 容器内配置：服务名互访 + Kafka 用容器地址
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/cs_enroll?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: kafka:9092
  cloud:
    discovery:
      client:
        simple:
          instances:
            cs-course:
              - uri: http://cs-course:8081

cs:
  mq:
    enabled: true
