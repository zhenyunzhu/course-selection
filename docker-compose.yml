# 一键起：MySQL + Redis + 三个服务
# Kafka 独立部署在宿主机（基础设施不与应用同生命周期），容器通过网络访问
# 用法：
#   mvn -DskipTests package
#   docker compose up -d --build
#   docker compose ps

services:

  mysql:
    image: mysql:8.0
    container_name: cs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./sql/01_course.sql:/docker-entrypoint-initdb.d/01_course.sql:ro
      - ./sql/02_enroll.sql:/docker-entrypoint-initdb.d/02_enroll.sql:ro
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cs-course:
    build:
      context: .
      dockerfile: cs-course/Dockerfile
    container_name: cs-course
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cs-enroll:
    build:
      context: .
      dockerfile: cs-enroll/Dockerfile
    container_name: cs-enroll
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      # Kafka 在 Windows 宿主机上：容器经 VM NAT 访问宿主机的 VMnet8 地址
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.91.1:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      cs-course:
        condition: service_started

  cs-gateway:
    build:
      context: .
      dockerfile: cs-gateway/Dockerfile
    container_name: cs-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"
    depends_on:
      redis:
        condition: service_healthy
      cs-enroll:
        condition: service_started
      cs-course:
        condition: service_started

volumes:
  mysql-data:
