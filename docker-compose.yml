# 一键起全套：MySQL + Redis + Kafka + 三个服务
# 用法：
#   mvn -DskipTests package      # 先在本机构建 jar（镜像只负责运行）
#   docker compose up -d
#   docker compose ps
# 访问：http://localhost:8088/api/auth/login

services:

  mysql:
    image: mysql:8.0
    container_name: cs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/01_course.sql:/docker-entrypoint-initdb.d/01_course.sql:ro
      - ./sql/02_enroll.sql:/docker-entrypoint-initdb.d/02_enroll.sql:ro
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    container_name: cs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12

  cs-course:
    build:
      context: .
      dockerfile: cs-course/Dockerfile
    container_name: cs-course
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cs-enroll:
    build:
      context: .
      dockerfile: cs-enroll/Dockerfile
    container_name: cs-enroll
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cs-course:
        condition: service_started

  cs-gateway:
    build:
      context: .
      dockerfile: cs-gateway/Dockerfile
    container_name: cs-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"
    depends_on:
      redis:
        condition: service_healthy
      cs-enroll:
        condition: service_started
      cs-course:
        condition: service_started

volumes:
  mysql-data:
